<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080d" />
    <meta
      name="description"
      content="A product-aware explainable screening interface for XPoSat POLIX Level-2 observations."
    />
    <title>XPoSat POLIX | Research Portal</title>
    <script>
      try {
        var theme = localStorage.getItem('polix-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        var mode = localStorage.getItem('polix-experience');
        if (mode === 'guided' || mode === 'console') document.documentElement.setAttribute('data-experience', mode);
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
